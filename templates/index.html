<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Demo Frontend</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 1200px;
      height: 760px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      display: flex;
      gap: 16px;
      padding: 16px;
    }

    .main {
      flex: 0 1 760px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
    }

    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, #D5E2E5 0%, #B9D8DF 48%, #D7D8D3 100%);
    }

    #avatar-stage {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #avatar-stage canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .avatar-controls {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .avatar-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar-toolbar button {
      height: 38px;
      border: 1px solid rgba(101, 154, 211, 0.45);
      border-radius: 10px;
      padding: 0 14px;
      background: rgba(220, 239, 252, 0.82);
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 4, 7, 0.14);
      backdrop-filter: blur(8px);
    }

    .avatar-toolbar button:hover {
      background: #B9D8DF;
      border-width: 2px;
      border-color: #4583E6;
    }

    .loop-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      user-select: none;
      cursor: pointer;
      padding: 4px 10px 4px 4px;
      border: 1px solid rgba(101, 154, 211, 0.55);
      border-radius: 10px;
      background: rgba(220, 239, 252, 0.82);
      box-shadow: 0 8px 20px rgba(0, 4, 7, 0.14);
      backdrop-filter: blur(8px);
    }

    .ui-checkbox {
      --primary-color: #1677ff;
      --secondary-color: #fff;
      --primary-hover-color: #4096ff;
      --checkbox-diameter: 20px;
      --checkbox-border-radius: 5px;
      --checkbox-border-color: #d9d9d9;
      --checkbox-border-width: 1px;
      --checkbox-border-style: solid;
      --checkmark-size: 1.2;
    }

    .ui-checkbox,
    .ui-checkbox *,
    .ui-checkbox *::before,
    .ui-checkbox *::after {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    .ui-checkbox {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: var(--checkbox-diameter);
      height: var(--checkbox-diameter);
      border-radius: var(--checkbox-border-radius);
      background: var(--secondary-color);
      border: var(--checkbox-border-width) var(--checkbox-border-style) var(--checkbox-border-color);
      -webkit-transition: all 0.3s;
      -o-transition: all 0.3s;
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
      flex: 0 0 var(--checkbox-diameter);
      margin: 0;
    }

    .ui-checkbox::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      -webkit-box-shadow: 0 0 0 calc(var(--checkbox-diameter) / 2.5) var(--primary-color);
      box-shadow: 0 0 0 calc(var(--checkbox-diameter) / 2.5) var(--primary-color);
      border-radius: inherit;
      opacity: 0;
      -webkit-transition: all 0.5s cubic-bezier(0.12, 0.4, 0.29, 1.46);
      -o-transition: all 0.5s cubic-bezier(0.12, 0.4, 0.29, 1.46);
      transition: all 0.5s cubic-bezier(0.12, 0.4, 0.29, 1.46);
    }

    .ui-checkbox::before {
      top: 40%;
      left: 50%;
      content: "";
      position: absolute;
      width: 4px;
      height: 7px;
      border-right: 2px solid var(--secondary-color);
      border-bottom: 2px solid var(--secondary-color);
      -webkit-transform: translate(-50%, -50%) rotate(45deg) scale(0);
      -ms-transform: translate(-50%, -50%) rotate(45deg) scale(0);
      transform: translate(-50%, -50%) rotate(45deg) scale(0);
      opacity: 0;
      -webkit-transition: all 0.1s cubic-bezier(0.71, -0.46, 0.88, 0.6),opacity 0.1s;
      -o-transition: all 0.1s cubic-bezier(0.71, -0.46, 0.88, 0.6),opacity 0.1s;
      transition: all 0.1s cubic-bezier(0.71, -0.46, 0.88, 0.6),opacity 0.1s;
    }

    .ui-checkbox:hover {
      border-color: var(--primary-color);
    }

    .ui-checkbox:checked {
      background: var(--primary-color);
      border-color: transparent;
    }

    .ui-checkbox:checked::before {
      opacity: 1;
      -webkit-transform: translate(-50%, -50%) rotate(45deg) scale(var(--checkmark-size));
      -ms-transform: translate(-50%, -50%) rotate(45deg) scale(var(--checkmark-size));
      transform: translate(-50%, -50%) rotate(45deg) scale(var(--checkmark-size));
      -webkit-transition: all 0.2s cubic-bezier(0.12, 0.4, 0.29, 1.46) 0.1s;
      -o-transition: all 0.2s cubic-bezier(0.12, 0.4, 0.29, 1.46) 0.1s;
      transition: all 0.2s cubic-bezier(0.12, 0.4, 0.29, 1.46) 0.1s;
    }

    .ui-checkbox:active:not(:checked)::after {
      -webkit-transition: none;
      -o-transition: none;
      -webkit-box-shadow: none;
      box-shadow: none;
      transition: none;
      opacity: 1;
    }


    .avatar-popover {
      position: absolute;
      top: 60px;
      left: 14px;
      z-index: 6;
      display: none;
      padding: 10px;
      background: rgba(220, 239, 252, 0.88);
      border: 1px solid rgba(101, 154, 211, 0.55);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 4, 7, 0.2);
      backdrop-filter: blur(10px);
    }

    .avatar-popover.open {
      display: grid;
      grid-template-columns: repeat(auto-fit, 112px);
      gap: 10px;
    }

    .avatar-choice {
      width: 112px;
      height: 112px;
      border: 1px solid rgba(101, 154, 211, 0.45);
      border-radius: 10px;
      padding: 8px;
      background: #fffff8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-choice:hover,
    .avatar-choice:focus-visible {
      outline: 2px solid #4583E6;
      outline-offset: 2px;
      border-color: #4583E6;
    }

    .avatar-choice.active {
      background: #D5DBDE;
      border-color: #4583E6;
    }

    .avatar-choice-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      display: block;
    }

    .subtitle {
      height: 180px;
      padding: 20px;
      font-size: 18px;
      color: #374151;
      overflow-y: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
      line-height: 1.5;
      background: #fffff8;
      border-color: rgba(142, 156, 171, 0.45);
      box-shadow: inset 0 0 18px rgba(213, 219, 222, 0.28);
      scrollbar-color: #024380 transparent;
      scrollbar-width: thin;
      text-align: left;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .subtitle::-webkit-scrollbar {
      width: 8px;
    }

    .subtitle::-webkit-scrollbar-track {
      background: transparent;
    }

    .subtitle::-webkit-scrollbar-thumb {
      background: #024380;
      border-radius: 999px;
    }

    .sidebar {
      width: 390px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 14px;
    }

    .control-card {
      background: #D5DBDE;
    }

    .app.release-mode .beta-only {
      display: none;
    }

    .app.release-mode .control-card {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .app.release-mode .input-row {
      flex: 1;
      min-height: 0;
    }

    .title {
      --title-height: 46px;
      text-align: right;
      font-family: Rajdhani, "Arial Narrow", "Segoe UI", sans-serif;
      margin: 0 0 6px 0;
      height: var(--title-height);
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .title-svg {
      width: 100%;
      height: calc(var(--title-height) + 8px);
      overflow: visible;
      display: block;
    }

    .title-svg text {
      font-family: Rajdhani, "Arial Narrow", "Segoe UI", sans-serif;
      font-size: calc(var(--title-height) * 0.78);
      font-style: normal;
      font-weight: 860;
      letter-spacing: 0;
      text-anchor: end;
      dominant-baseline: middle;
      stroke-linejoin: round;
    }

    .title-fill {
      fill: #111827;
    }

    .title-glow {
      fill: none;
      stroke: url(#title-edge-gradient);
      stroke-width: 6px;
      opacity: 1;
      filter: none;
    }

    .title-edge {
      fill: none;
      stroke: url(#title-edge-gradient);
      stroke-width: 2.2px;
      filter: none;
    }

    .camera {
      position: relative;
      height: 180px;
      border-radius: 14px;
      background:
        radial-gradient(circle at 50% 138%, #22384C 0 10%, transparent 11%),
        radial-gradient(circle at 50% 138%, #01223D 0 30%, transparent 31%),
        radial-gradient(circle at 50% 138%, #011A2D 0 49%, transparent 50%),
        radial-gradient(circle at 50% 138%, #010F1B 0 70%, transparent 71%),
        #000204;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d1d5db;
      margin-top: 0;
      overflow: hidden;
      border-left: 2px solid #2297FF;
      border-right: 2px solid #2297FF;
      border-top: 0 solid transparent;
      border-bottom: 0 solid transparent;
      transition: border-color 0.25s ease;
    }

    .camera:hover {
      border-top: 2px solid #2297FF;
      border-bottom: 2px solid #2297FF;
      border-color: #2297FF;
    }

    .camera.camera-active {
      border-left-color: #FFFFF8;
      border-right-color: #FFFFF8;
    }

    .camera.camera-active:hover {
      border-color: #FFFFF8;
    }

    .camera::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: transparent;
      backdrop-filter: none;
      box-shadow:
        inset 0 0 16px rgba(20, 121, 234, 0.95),
        inset 0 0 36px rgba(20, 121, 234, 0.72),
        inset 0 0 64px rgba(20, 121, 234, 0.42);
      opacity: 0;
      transition: opacity 0.28s ease, box-shadow 0.25s ease, background 0.25s ease;
      pointer-events: none;
    }

    .camera.camera-active::before {
      background: rgba(213, 219, 222, 0.32);
      backdrop-filter: blur(5px);
      box-shadow:
        inset 0 0 16px rgba(255, 255, 248, 0.92),
        inset 0 0 36px rgba(255, 255, 248, 0.58),
        inset 0 0 64px rgba(255, 255, 248, 0.28);
    }

    .camera::after {
      content: "Coming Soon";
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fffff8;
      font-family: Rajdhani, "Arial Narrow", "Segoe UI", sans-serif;
      font-size: 30px;
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0;
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      transition: opacity 0.28s ease, transform 0.28s ease;
      pointer-events: none;
    }

    .camera.camera-active::after {
      color: #212F4D;
    }

    .camera:hover::before,
    .camera:hover::after {
      opacity: 1;
    }

    .camera:hover::after {
      transform: translateY(0) scale(1);
    }

    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background:
        radial-gradient(circle at 50% 138%, #22384C 0 10%, transparent 11%),
        radial-gradient(circle at 50% 138%, #01223D 0 30%, transparent 31%),
        radial-gradient(circle at 50% 138%, #011A2D 0 49%, transparent 50%),
        radial-gradient(circle at 50% 138%, #010F1B 0 70%, transparent 71%),
        #000204;
    }

    .camera-toggle-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 248, 0.36);
      background: rgba(255, 255, 248, 0.28);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: 0 10px 24px rgba(0, 4, 7, 0.28);
      overflow: hidden;
      transition: transform 0.18s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .camera-toggle-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 248, 0.38);
      border-color: rgba(255, 255, 248, 0.54);
      box-shadow: 0 12px 28px rgba(0, 4, 7, 0.34);
    }

    .camera.camera-active .camera-toggle-btn {
      background: rgba(1, 34, 61, 0.38);
      border-color: rgba(255, 255, 248, 0.26);
    }

    .camera.camera-active .camera-toggle-btn:hover {
      background: rgba(1, 34, 61, 0.5);
      border-color: rgba(255, 255, 248, 0.36);
    }

    .camera-toggle-btn img {
      width: 58%;
      height: 58%;
      display: block;
      object-fit: contain;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      margin-top: 18px;
      min-height: 190px;
      border-radius: 32px;
      background: #fffff8;
      border: 1px solid #e5e7eb;
      overflow: hidden;
    }

    #text-input {
      flex: 1;
      width: 100%;
      min-height: 120px;
      border: none;
      padding: 24px 24px 0 24px;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
      resize: none;
      overflow-y: auto;
      scrollbar-color: #024380 transparent;
      scrollbar-width: thin;
      background: transparent;
      color: #1f2937;
    }

    #text-input::-webkit-scrollbar {
      width: 8px;
    }

    #text-input::-webkit-scrollbar-track {
      background: transparent;
    }

    #text-input::-webkit-scrollbar-thumb {
      background: #024380;
      border-radius: 999px;
    }

    #send-text-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border: none;
      border-radius: 50%;
      padding: 0;
      margin: 10px 18px 18px auto;
      cursor: pointer;
      background: transparent;
      box-shadow: 0 10px 20px rgba(7, 90, 151, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #send-text-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(7, 90, 151, 0.3);
    }

    #send-text-btn img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .label {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .value {
      font-size: 15px;
      color: #1f2937;
      line-height: 1.5;
      word-break: break-word;
    }

    #debug-log {
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
      max-height: 90px;
      overflow: auto;
      background: #fff;
      border-radius: 10px;
      padding: 8px;
      border: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="app">
      <div class="main">
        <div class="panel stage">
          <div id="avatar-stage">
            <div class="avatar-controls">
              <div class="avatar-toolbar">
                <button id="avatar-picker-btn" type="button">Avatar</button>
                <button id="avatar-replay-btn" type="button">Replay</button>
              </div>
              <label class="loop-control" for="avatar-loop-btn">
                <input id="avatar-loop-btn" class="ui-checkbox" type="checkbox" aria-label="Loop Play">
                <span>Loop Play</span>
              </label>
            </div>
            <div id="avatar-popover" class="avatar-popover" aria-hidden="true"></div>
          </div>
        </div>

        <div id="subtitle-output" class="panel subtitle">I'm an AI text-based model. I can provide information and answer questions with BSL and text.</div>
      </div>

      <div class="sidebar">
        <div class="card control-card">
          <div class="title" aria-label="BSL AVATAR">
            <svg class="title-svg" viewBox="0 0 360 58" role="img" aria-hidden="true">
              <defs>
                <linearGradient id="title-edge-gradient" x1="-360" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#659AD3" />
                  <stop offset="38%" stop-color="#DCEFFC" />
                  <stop offset="62%" stop-color="#4583E6" />
                  <stop offset="100%" stop-color="#659AD3" />
                  <animate attributeName="x1" values="-360;360" dur="2.4s" repeatCount="indefinite" />
                  <animate attributeName="x2" values="0;720" dur="2.4s" repeatCount="indefinite" />
                </linearGradient>
                <filter id="title-neon-glow" x="-30%" y="-80%" width="160%" height="260%">
                  <feGaussianBlur stdDeviation="1.1" result="softGlow" />
                  <feGaussianBlur stdDeviation="2.2" result="wideGlow" />
                  <feMerge>
                    <feMergeNode in="wideGlow" />
                    <feMergeNode in="softGlow" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
              <text class="title-glow" x="360" y="30">BSL AVATAR</text>
              <text class="title-edge" x="360" y="30">BSL AVATAR</text>
              <text class="title-fill" x="360" y="30">BSL AVATAR</text>
            </svg>
          </div>

          <div class="camera">
            <video id="camera-video" autoplay playsinline muted></video>
            <button id="camera-toggle-btn" class="camera-toggle-btn" type="button" aria-label="Turn camera on"><img id="camera-toggle-icon" src="/static/src/video_off.png" alt="" /></button>
          </div>

          <div class="input-row">
            <textarea id="text-input" placeholder="Enter text to send..." autocomplete="off"></textarea>
            <button id="send-text-btn" type="button" aria-label="Send text">
              <img src="/static/src/send.png" alt="" />
            </button>
          </div>
        </div>

        <div class="card beta-only">
          <div class="label">状态</div>
          <div id="camera-status" class="value">前端界面已启动</div>
        </div>

        <div class="card beta-only">
          <div class="label">调试日志</div>
          <div id="debug-log" class="value">Waiting for logs...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const IS_BETA = false;
    const appEl = document.querySelector(".app");
    if (appEl) {
      appEl.classList.toggle("beta-mode", IS_BETA);
      appEl.classList.toggle("release-mode", !IS_BETA);
    }

    const debugLogEl = document.getElementById("debug-log");

    function logDebug(...args) {
      const msg = args.map(v => {
        try {
          if (typeof v === "string") return v;
          return JSON.stringify(v);
        } catch {
          return String(v);
        }
      }).join(" ");

      console.log("[INDEX]", ...args);

      if (debugLogEl) {
        debugLogEl.textContent += "\\n" + msg;
        debugLogEl.scrollTop = debugLogEl.scrollHeight;
      }
    }

    if (debugLogEl) {
      debugLogEl.textContent = "index.html loaded";
    }
    logDebug("index.html loaded");
    logDebug("href =", window.location.href);


    const avatarPickerBtn = document.getElementById("avatar-picker-btn");
    const avatarReplayBtn = document.getElementById("avatar-replay-btn");
    const avatarLoopBtn = document.getElementById("avatar-loop-btn");
    const avatarPopover = document.getElementById("avatar-popover");
    const AVATAR_MODEL_STORAGE_KEY = "sign-demo-avatar-model";

    function normalizeAvatarModelPath(model) {
      if (!model) return "";
      return model.startsWith("/") ? model : `/models/${model}`;
    }

    function getStoredAvatarModelPath() {
      try {
        return window.localStorage.getItem(AVATAR_MODEL_STORAGE_KEY) || "";
      } catch {
        return "";
      }
    }

    function setAvatarPopoverOpen(isOpen) {
      if (!avatarPopover || !avatarPickerBtn) return;
      avatarPopover.classList.toggle("open", isOpen);
      avatarPopover.setAttribute("aria-hidden", String(!isOpen));
      avatarPickerBtn.setAttribute("aria-expanded", String(isOpen));
    }

    function renderAvatarChoices(avatars) {
      if (!avatarPopover) return;

      avatarPopover.replaceChildren();

      const storedModelPath = getStoredAvatarModelPath();

      Object.entries(avatars).forEach(([avatarId, avatar]) => {
        const choice = document.createElement("button");
        choice.className = "avatar-choice";
        choice.type = "button";
        const modelPath = normalizeAvatarModelPath(avatar.model);

        const snapshotPath = normalizeAvatarModelPath(avatar.snapshot);
        const label = avatar.label || avatarId;

        choice.dataset.avatar = avatarId;
        choice.dataset.model = avatar.model || "";
        choice.dataset.snapshot = avatar.snapshot || "";
        choice.setAttribute("aria-label", label);

        if (snapshotPath) {
          const image = document.createElement("img");
          image.className = "avatar-choice-img";
          image.src = snapshotPath;
          image.alt = "";
          image.loading = "lazy";
          choice.appendChild(image);
        }

        if (storedModelPath ? modelPath === storedModelPath : avatar.default) {
          choice.classList.add("active");
        }

        choice.addEventListener("click", async () => {
          setAvatarPopoverOpen(false);

          if (!window.switchAvatarModel) {
            logDebug("avatar switch failed = switchAvatarModel is not ready");
            return;
          }

          try {
            logDebug("avatar switch requested =", avatarId, modelPath);
            const switched = await window.switchAvatarModel(modelPath);

            if (switched === false) {
              return;
            }

            avatarPopover.querySelectorAll(".avatar-choice").forEach((item) => {
              item.classList.remove("active");
            });
            choice.classList.add("active");
            try {
              window.localStorage.setItem(AVATAR_MODEL_STORAGE_KEY, modelPath);
            } catch {}
            logDebug("avatar switched =", avatarId, avatar.model);
          } catch (error) {
            logDebug("avatar switch failed =", String(error));
          }
        });

        avatarPopover.appendChild(choice);
      });
    }

    async function loadAvatarChoices() {
      try {
        const response = await fetch("/models/avatars.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`avatars.json HTTP ${response.status}`);
        }

        const avatars = await response.json();
        renderAvatarChoices(avatars);
        logDebug("avatar choices loaded =", Object.keys(avatars).join(", "));
      } catch (error) {
        logDebug("avatar choices failed =", String(error));
      }
    }

    if (avatarPickerBtn && avatarPopover) {
      avatarPickerBtn.setAttribute("aria-haspopup", "true");
      avatarPickerBtn.setAttribute("aria-expanded", "false");

      avatarPickerBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        setAvatarPopoverOpen(!avatarPopover.classList.contains("open"));
      });

      avatarPopover.addEventListener("click", (event) => {
        event.stopPropagation();
      });

      document.addEventListener("click", () => {
        setAvatarPopoverOpen(false);
      });

      loadAvatarChoices();
    }


    if (avatarReplayBtn) {
      avatarReplayBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        setAvatarPopoverOpen(false);

        if (window.resetAnimationPlayback) {
          window.resetAnimationPlayback();
          logDebug("avatar animation replayed");
        } else {
          logDebug("avatar replay failed = resetAnimationPlayback is not ready");
        }
      });
    }

    function syncLoopButtonState() {
      if (!avatarLoopBtn) return;

      const enabled = window.getAnimationLoopEnabled ? window.getAnimationLoopEnabled() : false;
      avatarLoopBtn.checked = enabled;
    }

    if (avatarLoopBtn) {
      avatarLoopBtn.addEventListener("change", (event) => {
        event.stopPropagation();
        setAvatarPopoverOpen(false);

        if (window.setAnimationLoopEnabled) {
          const enabled = window.setAnimationLoopEnabled(avatarLoopBtn.checked);
          syncLoopButtonState();
          logDebug("avatar loop enabled =", enabled);
        } else {
          logDebug("avatar loop toggle failed = loop API is not ready");
        }
      });

      syncLoopButtonState();
    }

    window.addEventListener("error", (e) => {
      logDebug("window error:", e.message, "@", e.filename + ":" + e.lineno);
    });

    window.addEventListener("unhandledrejection", (e) => {
      logDebug("unhandled rejection:", String(e.reason));
    });
  </script>
