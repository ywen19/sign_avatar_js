<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Demo Frontend</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 1200px;
      height: 760px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      display: flex;
      gap: 16px;
      padding: 16px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
    }

    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #202020;
    }

    #avatar-stage {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #avatar-stage canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .avatar-toolbar {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      display: flex;
      align-items: center;
    }

    #avatar-picker-btn {
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 0 14px;
      background: rgba(17, 24, 39, 0.82);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(8px);
    }

    #avatar-picker-btn:hover {
      background: rgba(31, 41, 55, 0.92);
      border-color: rgba(255, 255, 255, 0.36);
    }


    .avatar-popover {
      position: absolute;
      top: 60px;
      left: 14px;
      z-index: 6;
      display: none;
      min-width: 180px;
      padding: 10px;
      background: rgba(250, 250, 250, 0.96);
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(10px);
    }

    .avatar-popover.open {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .avatar-choice {
      height: 42px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .avatar-choice:hover,
    .avatar-choice:focus-visible {
      outline: 2px solid #22c55e;
      outline-offset: 2px;
      border-color: #22c55e;
    }

    .avatar-choice.active {
      background: #111827;
      color: #ffffff;
      border-color: #111827;
    }

    .subtitle {
      height: 180px;
      padding: 20px;
      font-size: 18px;
      color: #374151;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .sidebar {
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 14px;
    }

    .title {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .camera {
      height: 180px;
      border-radius: 14px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d1d5db;
      margin-top: 12px;
      overflow: hidden;
    }

    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111827;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      align-items: stretch;
    }

    #text-input {
      flex: 1;
      height: 70px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      outline: none;
      background: white;
      color: #1f2937;
    }

    #send-text-btn {
      height: 70px;
      min-width: 80px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 15px;
      cursor: pointer;
      background: white;
      color: #374151;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: white;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .label {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .value {
      font-size: 15px;
      color: #1f2937;
      line-height: 1.5;
      word-break: break-word;
    }

    #debug-log {
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
      max-height: 90px;
      overflow: auto;
      background: #fff;
      border-radius: 10px;
      padding: 8px;
      border: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="app">
      <div class="main">
        <div class="panel stage">
          <div id="avatar-stage">
            <div class="avatar-toolbar">
              <button id="avatar-picker-btn" type="button">Avatar</button>
            </div>
            <div id="avatar-popover" class="avatar-popover" aria-hidden="true"></div>
          </div>
        </div>

        <div id="subtitle-output" class="panel subtitle">
          This is going to be the subtitle for the generated answers. 
        </div>
      </div>

      <div class="sidebar">
        <div class="card">
          <div class="title">Sign Demo</div>

          <div class="camera">
            <video id="camera-video" autoplay playsinline muted></video>
          </div>

          <div class="buttons">
            <button id="start-camera-btn" class="primary">Start</button>
            <button id="stop-camera-btn" class="secondary">End</button>
          </div>

          <div class="input-row">
            <input id="text-input" type="text" placeholder="Enter text to send..." autocomplete="off" />
            <button id="send-text-btn">Send</button>
          </div>
        </div>

        <div class="card">
          <div class="label">状态</div>
          <div id="camera-status" class="value">前端界面已启动</div>
        </div>

        <div class="card">
          <div class="label">调试日志</div>
          <div id="debug-log" class="value">Waiting for logs...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const debugLogEl = document.getElementById("debug-log");

    function logDebug(...args) {
      const msg = args.map(v => {
        try {
          if (typeof v === "string") return v;
          return JSON.stringify(v);
        } catch {
          return String(v);
        }
      }).join(" ");

      console.log("[INDEX]", ...args);

      if (debugLogEl) {
        debugLogEl.textContent += "\\n" + msg;
        debugLogEl.scrollTop = debugLogEl.scrollHeight;
      }
    }

    debugLogEl.textContent = "index.html loaded";
    logDebug("index.html loaded");
    logDebug("href =", window.location.href);


    const avatarPickerBtn = document.getElementById("avatar-picker-btn");
    const avatarPopover = document.getElementById("avatar-popover");

    function setAvatarPopoverOpen(isOpen) {
      if (!avatarPopover || !avatarPickerBtn) return;
      avatarPopover.classList.toggle("open", isOpen);
      avatarPopover.setAttribute("aria-hidden", String(!isOpen));
      avatarPickerBtn.setAttribute("aria-expanded", String(isOpen));
    }

    function renderAvatarChoices(avatars) {
      if (!avatarPopover) return;

      avatarPopover.replaceChildren();

      Object.entries(avatars).forEach(([avatarId, avatar]) => {
        const choice = document.createElement("button");
        choice.className = "avatar-choice";
        choice.type = "button";
        choice.dataset.avatar = avatarId;
        choice.dataset.model = avatar.model || "";
        choice.dataset.snapshot = avatar.snapshot || "";
        choice.textContent = avatar.label || avatarId;

        if (avatar.default) {
          choice.classList.add("active");
        }

        choice.addEventListener("click", () => {
          avatarPopover.querySelectorAll(".avatar-choice").forEach((item) => {
            item.classList.remove("active");
          });
          choice.classList.add("active");
          logDebug("avatar choice selected =", avatarId, avatar.model);
        });

        avatarPopover.appendChild(choice);
      });
    }

    async function loadAvatarChoices() {
      try {
        const response = await fetch("/models/avatars.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`avatars.json HTTP ${response.status}`);
        }

        const avatars = await response.json();
        renderAvatarChoices(avatars);
        logDebug("avatar choices loaded =", Object.keys(avatars).join(", "));
      } catch (error) {
        logDebug("avatar choices failed =", String(error));
      }
    }

    if (avatarPickerBtn && avatarPopover) {
      avatarPickerBtn.setAttribute("aria-haspopup", "true");
      avatarPickerBtn.setAttribute("aria-expanded", "false");

      avatarPickerBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        setAvatarPopoverOpen(!avatarPopover.classList.contains("open"));
      });

      avatarPopover.addEventListener("click", (event) => {
        event.stopPropagation();
      });

      document.addEventListener("click", () => {
        setAvatarPopoverOpen(false);
      });

      loadAvatarChoices();
    }

    window.addEventListener("error", (e) => {
      logDebug("window error:", e.message, "@", e.filename + ":" + e.lineno);
    });

    window.addEventListener("unhandledrejection", (e) => {
      logDebug("unhandled rejection:", String(e.reason));
    });
  </script>

  <script src="/js/three.min.js"></script>
  <script>
    logDebug("three.min.js tag executed");
    logDebug("window.THREE exists =", !!window.THREE);
    if (window.THREE) {
      logDebug("THREE.REVISION =", window.THREE.REVISION);
    }
  </script>

  <script src="/js/GLTFLoader.js"></script>
  <script>
    logDebug("GLTFLoader.js tag executed");
    logDebug("THREE.GLTFLoader exists =", !!(window.THREE && window.THREE.GLTFLoader));
  </script>

  <script type="module" src="/camera.js"></script>
  <script>
    logDebug("camera.js module tag added");
  </script>

  <script type="module" src="/text_input.js"></script>
  <script>
    logDebug("text_input.js module tag added");
  </script>

  <script type="module" src="/avatar.js"></script>
  <script>
    logDebug("avatar.js module tag added");
  </script>
</body>
</html>
