<!doctype html>
<!--
  Defines the frontend page structure for the BSL Avatar application,
  including the avatar display, avatar controls, camera preview, text input,
  subtitles, and diagnostic panels. Visual styling is provided by style.css,
  while interaction and animation behavior is provided by the loaded scripts.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSL Avatar</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page">
    <div class="app">
      <main class="main">
        <div class="panel stage">
          <div id="avatar-stage">
            <div class="avatar-controls">
              <div
                class="avatar-toolbar"
                role="group"
                aria-label="Avatar controls"
              >
                <button id="avatar-picker-btn" type="button">Avatar</button>
                <button id="avatar-replay-btn" type="button">Replay</button>
              </div>
              <label class="loop-control" for="avatar-loop-btn">
                <input
                  id="avatar-loop-btn"
                  class="ui-checkbox"
                  type="checkbox"
                  aria-label="Loop Play"
                >
                <span>Loop Play</span>
              </label>
            </div>
            <div id="avatar-popover" class="avatar-popover" aria-hidden="true"></div>
          </div>
        </div>

        <div
          id="subtitle-output"
          class="panel subtitle"
          aria-live="polite"
        >
          I'm an AI text-based model. I can provide information and answer
          questions with BSL and text.
        </div>
      </main>

      <aside class="sidebar">
        <div class="card control-card">
          <div class="title" aria-label="BSL AVATAR">
            <svg class="title-svg" viewBox="0 0 360 58" role="img" aria-hidden="true">
              <defs>
                <linearGradient
                  id="title-edge-gradient"
                  x1="-360"
                  y1="0"
                  x2="0"
                  y2="0"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" stop-color="#659AD3" />
                  <stop offset="38%" stop-color="#DCEFFC" />
                  <stop offset="62%" stop-color="#4583E6" />
                  <stop offset="100%" stop-color="#659AD3" />
                  <animate
                    attributeName="x1"
                    values="-360;360"
                    dur="2.4s"
                    repeatCount="indefinite"
                  />
                  <animate
                    attributeName="x2"
                    values="0;720"
                    dur="2.4s"
                    repeatCount="indefinite"
                  />
                </linearGradient>
                <filter
                  id="title-neon-glow"
                  x="-30%"
                  y="-80%"
                  width="160%"
                  height="260%"
                >
                  <feGaussianBlur stdDeviation="1.1" result="softGlow" />
                  <feGaussianBlur stdDeviation="2.2" result="wideGlow" />
                  <feMerge>
                    <feMergeNode in="wideGlow" />
                    <feMergeNode in="softGlow" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
              <text class="title-glow" x="360" y="30">BSL AVATAR</text>
              <text class="title-edge" x="360" y="30">BSL AVATAR</text>
              <text class="title-fill" x="360" y="30">BSL AVATAR</text>
            </svg>
          </div>

          <div class="camera">
            <video id="camera-video" autoplay playsinline muted></video>
            <button
              id="camera-toggle-btn"
              class="camera-toggle-btn"
              type="button"
              aria-label="Turn camera on"
            >
              <img
                id="camera-toggle-icon"
                src="/static/src/video_off.png"
                alt=""
              />
            </button>
          </div>

          <div class="input-row">
            <textarea
              id="text-input"
              aria-label="Message"
              placeholder="Enter text to send..."
              autocomplete="off"
            ></textarea>
            <button id="send-text-btn" type="button" aria-label="Send text">
              <img src="/static/src/send.png" alt="" />
            </button>
          </div>
        </div>

        <div class="card beta-only">
          <div class="label">Status</div>
          <div
            id="camera-status"
            class="value"
            role="status"
            aria-live="polite"
          >
            Frontend interface started
          </div>
        </div>

        <div class="card beta-only">
          <div class="label">Debug Log</div>
          <div id="debug-log" class="value">Waiting for logs...</div>
        </div>
      </aside>
    </div>
  </div>

  <script src="/static/js/ui.js?v=model-cache-disabled-20260713"></script>

  <script src="/js/three.min.js"></script>
  <script src="/js/GLTFLoader.js"></script>
  <script
    type="module"
    src="/static/js/camera.js?v=camera-only-20260624"
  ></script>
  <script
    type="module"
    src="/static/js/text_input.js?v=loop-toggle-live-20260625"
  ></script>
  <script
    type="module"
    src="/static/js/avatar.js?v=hips-alignment-20260713"
  ></script>
  <script src="/static/js/diagnostics.js?v=20260712"></script>
</body>
</html>
